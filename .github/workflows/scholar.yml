name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scholarly==1.7.11

      - name: Fetch stats
        run: python .github/scripts/scholar_stats.py assets/json/scholar.json

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/json/scholar.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/json/scholar.json
          git commit -m "update Google Scholar stats"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
